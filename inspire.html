<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>高考加油 - 相信自己！</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/images/logo.png">
</head>
<body>
    <div class="container inspire-container">
        <!-- 背景粒子效果 -->
        <div class="particles" id="particles"></div>
        
        <!-- 返回按钮 -->
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            返回
        </button>

        <!-- 激励内容 -->
        <main class="inspire-content">
            <div class="quote-card">
                <div class="quote-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 21c0 .5.4 1 1 1h4c.6 0 1-.5 1-1v-1H9v1zm3-19C8.1 2 5 5.1 5 9c0 2.4 1.2 4.5 3 5.7V17c0 .5.4 1 1 1h6c.6 0 1-.5 1-1v-2.3c1.8-1.3 3-3.4 3-5.7 0-3.9-3.1-7-7-7z"/>
                    </svg>
                </div>
                <blockquote class="quote-text" id="quoteText">
                    加载中...
                </blockquote>
                <cite class="quote-author" id="quoteAuthor"></cite>
            </div>

            <!-- 动作按钮 -->
            <div class="action-buttons">
                <button class="btn btn-primary" id="newQuoteBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6M3.5 10.5A9 9 0 0 0 4 21h12a9 9 0 0 0 1-10.5L12 3 3.5 10.5z"/>
                    </svg>
                    换一句
                </button>
                <button class="btn btn-secondary" id="shareBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                        <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>
                    </svg>
                    分享
                </button>
            </div>

            <!-- 能量条 -->
            <div class="energy-section">
                <h3>你的能量值</h3>
                <div class="energy-bar">
                    <div class="energy-fill" id="energyFill"></div>
                </div>
                <p class="energy-text" id="energyText">100%</p>
            </div>
        </main>

        <!-- 成功动画 -->
        <div class="success-animation" id="successAnimation">
            <div class="success-icon">🎉</div>
            <p>已获得能量加成！</p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
