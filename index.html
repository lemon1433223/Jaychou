<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>湖南高考倒计时 - 加油！</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/images/logo.png">
</head>
<body>
    <div class="container">
        <!-- 背景装饰 -->
        <div class="bg-decoration">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
        
        <!-- 湖南特色元素 -->
        <div class="hunan-elements">
            <div class="element yuelu-mountain"></div>
            <div class="element orange-island"></div>
        </div>

        <!-- 主要内容 -->
        <main class="main-content">
            <!-- 头部信息 -->
            <header class="header">
                <div class="logo">
                    <img src="assets/images/logo.png" alt="湖南高考">
                    <span>湖南高考加油</span>
                </div>
                <div class="date-info">
                    <p class="current-date" id="currentDate"></p>
                    <p class="exam-date">2025年高考：6月7日</p>
                </div>
            </header>

            <!-- 倒计时区域 -->
            <section class="countdown-section" id="countdownSection">
                <h1 class="countdown-title">距离高考还有</h1>
                <div class="countdown-display" id="countdown">
                    <div class="time-box">
                        <span class="number" id="days">00</span>
                        <span class="label">天</span>
                    </div>
                    <div class="time-box">
                        <span class="number" id="hours">00</span>
                        <span class="label">时</span>
                    </div>
                    <div class="time-box">
                        <span class="number" id="minutes">00</span>
                        <span class="label">分</span>
                    </div>
                    <div class="time-box">
                        <span class="number" id="seconds">00</span>
                        <span class="label">秒</span>
                    </div>
                </div>
                <p class="countdown-tip">点击倒计时，获取加油能量</p>
            </section>

            <!-- 进度条 -->
            <section class="progress-section">
                <h3>备考进度</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText">已完成85%</p>
            </section>

            <!-- 励志卡片 -->
            <section class="motivation-card">
                <h3>今日目标</h3>
                <p id="dailyGoal">每天进步一点点，成功就在眼前</p>
            </section>
        </main>

        <!-- 底部装饰 -->
        <footer class="footer">
            <p>岳麓山下，湘江之滨，湖南学子必创辉煌！</p>
        </footer>
    </div>

    <!-- 触摸反馈 -->
    <div class="touch-effect" id="touchEffect"></div>

    <script src="js/main.js"></script>
</body>
</html>
